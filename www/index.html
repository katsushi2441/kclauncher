<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kurage Capacitor Launcher</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6bd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurage">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<style>
  :root{--a:#2f6bd8;--c:#0b91a7}
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f5;color:#22303c;
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:linear-gradient(90deg,var(--c),var(--a));color:#fff;padding:16px 18px;font-weight:900;font-size:19px;
    display:flex;align-items:center;gap:10px}
  header .logo{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:15px}
  main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
  .toolbar{display:flex;gap:8px;justify-content:flex-end;margin:0 2px 10px}
  .toolbar button{background:#fff;border:1px solid #cfd9e2;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:800;color:#42566a;cursor:pointer}
  .toolbar button.on{background:var(--a);color:#fff;border-color:var(--a)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;
    min-height:110px;background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:14px;
    text-decoration:none;color:#22303c;box-shadow:0 6px 16px rgba(20,40,60,.06)}
  .tile:active{transform:scale(.98)}
  .tile .emoji{font-size:32px}
  .tile b{font-size:15px}
  .tile small{color:#6b7a88;font-size:11px;word-break:break-all}
  .tile .acts{position:absolute;top:6px;right:6px;display:none;gap:6px}
  body.edit .tile .acts{display:flex}
  .tile .acts button{width:28px;height:28px;border:0;border-radius:50%;font-size:14px;font-weight:900;line-height:1;cursor:pointer}
  .tile .edit{background:#eaf1fb;color:#2f6bd8}
  .tile .del{background:#fdecec;color:#c0392b}
  body.edit .tile{border-style:dashed}
  .empty{grid-column:1/3;color:#9aa8b5;font-size:13px;text-align:center;padding:14px}
  .card{background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:16px;margin-top:14px}
  .card h3{margin:0 0 4px;font-size:15px}
  .card label{display:block;font-size:12px;color:#5a6b7a;font-weight:700;margin:8px 0 3px}
  .card input{width:100%;border:1px solid #cfd9e2;border-radius:10px;padding:11px;font:inherit;background:#fbfdfe}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{margin-top:12px;width:100%;border:0;border-radius:11px;background:var(--a);color:#fff;font:800 15px inherit;padding:12px;cursor:pointer}
  .btn.ghost{background:#fff;color:#42566a;border:1px solid #cfd9e2;margin-top:8px}
  .hint{color:#8090a0;font-size:11.5px;margin:6px 2px 0}
  .foot{color:#9aa8b5;font-size:11px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<header><span class="logo">🪼</span>Kurage Capacitor Launcher</header>
<main>
  <div class="toolbar"><button id="editBtn">編集</button></div>
  <div class="grid" id="grid"></div>

  <div class="card" id="form" style="display:none">
    <h3 id="formTitle">＋ リンクを追加</h3>
    <div class="row">
      <div style="flex:3"><label>名前</label><input id="fName" placeholder="例: うちのカレンダー"></div>
      <div style="flex:1"><label>絵文字</label><input id="fEmoji" placeholder="🗓" maxlength="2"></div>
    </div>
    <label>URL</label><input id="fUrl" placeholder="https://あなたのサーバー/cal/" inputmode="url">
    <button class="btn" id="saveBtn">保存</button>
    <button class="btn ghost" id="cancelBtn">キャンセル</button>
    <p class="hint">自分のサーバーの kcaldav.php を入れればカレンダー、kuragev.php を入れれば動画。開くURL次第で中身が変わります。</p>
  </div>

  <button class="btn" id="addBtn" style="max-width:640px">＋ リンクを追加</button>
  <p class="foot">タイルはアプリ内ブラウザで開きます（左上の×でここへ戻る）。<br>powered by Capacitor</p>
</main>

<script>
  var SEED_VERSION = 2;   // 既定タイルを増やしたら上げる(既存インストールにも反映される)
  var DEFAULTS = [
    {emoji:'🗓', name:'カレンダー',  url:'https://exbridge.jp/cal/'},
    {emoji:'🎬', name:'Kurage動画', url:'https://kurage.exbridge.jp/kuragev.php'},
    {emoji:'🔮', name:'タロット占い', url:'https://kurage.exbridge.jp/ktarot.html'},
    {emoji:'🧗', name:'クライミング', url:'https://kurage.exbridge.jp/kclimbing.html'},
    {emoji:'🆕', name:'アプリ新着',  url:'https://kappstore.exbridge.jp/'}
  ];
  var editingIndex = null;

  function load(){
    var raw = localStorage.getItem('kc_tiles');
    var list;
    if (raw === null) { list = DEFAULTS.slice(); }
    else { try { list = JSON.parse(raw); if (!Array.isArray(list)) list = DEFAULTS.slice(); }
           catch(e){ list = DEFAULTS.slice(); } }
    // 既定の追加分を、未登録のURLだけ補う(削除済みは復活させない=バージョン管理)
    var sv = parseInt(localStorage.getItem('kc_seed_v') || '0', 10);
    if (sv < SEED_VERSION) {
      var have = {}; list.forEach(function(t){ have[t.url] = 1; });
      DEFAULTS.forEach(function(d){ if (!have[d.url]) list.push(d); });
      localStorage.setItem('kc_seed_v', String(SEED_VERSION));
      save(list);
    }
    return list;
  }
  function save(a){ localStorage.setItem('kc_tiles', JSON.stringify(a)); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render(){
    var list = load();
    var g = document.getElementById('grid');
    g.innerHTML = list.length ? list.map(function(x,i){
      return '<a class="tile" href="'+esc(x.url)+'">'
        + '<span class="acts"><button class="edit" data-edit="'+i+'">✎</button>'
        + '<button class="del" data-del="'+i+'">×</button></span>'
        + '<span class="emoji">'+esc(x.emoji||'🔗')+'</span>'
        + '<span><b>'+esc(x.name)+'</b><br><small>'+esc(x.url)+'</small></span></a>';
    }).join('') : '<p class="empty">タイルがありません。下の「＋ リンクを追加」から追加してください。</p>';
  }

  function openForm(idx){
    editingIndex = (idx==null) ? null : idx;
    var list = load();
    var t = (idx==null) ? {emoji:'',name:'',url:''} : list[idx];
    document.getElementById('fName').value = t.name || '';
    document.getElementById('fEmoji').value = t.emoji || '';
    document.getElementById('fUrl').value = t.url || '';
    document.getElementById('formTitle').textContent = (idx==null) ? '＋ リンクを追加' : 'リンクを編集';
    document.getElementById('saveBtn').textContent = (idx==null) ? '追加する' : '更新する';
    document.getElementById('form').style.display = 'block';
    document.getElementById('addBtn').style.display = 'none';
    document.getElementById('fName').focus();
  }
  function closeForm(){
    editingIndex = null;
    document.getElementById('form').style.display = 'none';
    document.getElementById('addBtn').style.display = '';
  }

  document.getElementById('addBtn').addEventListener('click', function(){ openForm(null); });
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  document.getElementById('saveBtn').addEventListener('click', function(){
    var name = document.getElementById('fName').value.trim();
    var url  = document.getElementById('fUrl').value.trim();
    var emoji= document.getElementById('fEmoji').value.trim() || '🔗';
    if (!name || !/^https?:\/\//.test(url)) { alert('名前と、http(s)で始まるURLを入れてください。'); return; }
    var list = load();
    if (editingIndex==null) { list.push({emoji:emoji,name:name,url:url}); }
    else { list[editingIndex] = {emoji:emoji,name:name,url:url}; }
    save(list); closeForm(); render();
  });

  // タイルの編集/削除(編集モード時)
  document.getElementById('grid').addEventListener('click', function(e){
    var ed = e.target.getAttribute && e.target.getAttribute('data-edit');
    var dl = e.target.getAttribute && e.target.getAttribute('data-del');
    if (ed!=null && ed!==''){ e.preventDefault(); e.stopPropagation(); openForm(parseInt(ed,10)); return; }
    if (dl!=null && dl!==''){ e.preventDefault(); e.stopPropagation();
      var list=load(); var t=list[parseInt(dl,10)];
      if (confirm('「'+(t?t.name:'')+'」を削除しますか？')){ list.splice(parseInt(dl,10),1); save(list); render(); }
      return;
    }
  }, true);

  document.getElementById('editBtn').addEventListener('click', function(){
    var on = document.body.classList.toggle('edit');
    this.classList.toggle('on', on);
    this.textContent = on ? '完了' : '編集';
    if (!on) closeForm();
  });

  // タイルの開き方(戻れるように環境で分岐):
  //  ・アプリ(Capacitor)     → アプリ内ブラウザ(Custom Tab)。×で戻る
  //  ・iPhone等のPWA(standalone) → window.open で別ビュー。iOSは「完了」で戻れる
  //    (standaloneには戻るボタンが無いので、同一画面で遷移すると詰む)
  //  ・通常のブラウザタブ    → そのまま遷移(ブラウザの戻るがある)
  var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                     || window.navigator.standalone === true;
  document.getElementById('grid').addEventListener('click', function(e){
    if (document.body.classList.contains('edit')) return;           // 編集中は開かない
    var a = e.target.closest ? e.target.closest('a.tile') : null;
    if (!a) return;
    var url = a.getAttribute('href');
    if (isNative) {
      e.preventDefault();
      var B = window.Capacitor.Plugins.Browser;
      if (B && B.open) { B.open({ url:url, toolbarColor:'#2f6bd8', presentationStyle:'fullscreen' }); }
      else { window.location.href = url; }
    } else if (isStandalone) {
      e.preventDefault();
      window.open(url, '_blank');
    }
    // 通常ブラウザは既定の遷移に任せる
  });

  // PWA(ホーム画面に追加)のService Worker。アプリ(Capacitor)では登録しない
  if (!isNative && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  render();
</script>
</body>
</html>
