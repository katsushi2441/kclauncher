<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kurage ランチャー</title>
<style>
  :root{--a:#2f6bd8;--c:#0b91a7}
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f5;color:#22303c;
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:linear-gradient(90deg,var(--c),var(--a));color:#fff;padding:18px 18px;font-weight:900;font-size:20px;
    display:flex;align-items:center;gap:10px}
  header .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:16px}
  main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
  h2{font-size:13px;color:#5a6b7a;letter-spacing:.06em;margin:18px 4px 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;
    min-height:104px;background:#fff;border:1px solid #dbe3ea;border-radius:16px;padding:14px;
    text-decoration:none;color:#22303c;box-shadow:0 6px 16px rgba(20,40,60,.06)}
  .tile:active{transform:scale(.98)}
  .tile .emoji{font-size:30px}
  .tile b{font-size:15px}
  .tile small{color:#6b7a88;font-size:11px;word-break:break-all}
  .tile .del{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;border-radius:50%;
    background:#f0f3f6;color:#c0392b;font-size:15px;font-weight:900;line-height:1;cursor:pointer;display:none}
  body.edit .tile .del{display:block}
  .addcard{background:#fff;border:1px dashed #b9c6d2;border-radius:16px;padding:14px;margin-top:12px}
  .addcard label{display:block;font-size:12px;color:#5a6b7a;font-weight:700;margin:6px 0 3px}
  .addcard input{width:100%;border:1px solid #cfd9e2;border-radius:10px;padding:10px;font:inherit;background:#fbfdfe}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{margin-top:10px;width:100%;border:0;border-radius:11px;background:var(--a);color:#fff;font:800 14px inherit;padding:12px;cursor:pointer}
  .toolbar{display:flex;gap:8px;justify-content:flex-end;margin:2px 4px 0}
  .toolbar button{background:#fff;border:1px solid #cfd9e2;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:#42566a;cursor:pointer}
  .hint{color:#8090a0;font-size:11.5px;text-align:center;margin-top:22px;padding:0 10px}
</style>
</head>
<body>
<header><span class="logo">🪼</span>Kurage ランチャー</header>
<main>
  <div class="toolbar">
    <button id="editBtn">編集</button>
  </div>

  <h2>KURAGE サービス</h2>
  <div class="grid" id="builtin"></div>

  <h2>マイリンク（自分のサーバーなど）</h2>
  <div class="grid" id="mine"></div>

  <div class="addcard">
    <b style="font-size:14px">＋ リンクを追加</b>
    <div class="row">
      <div><label>名前</label><input id="addName" placeholder="例: うちのカレンダー"></div>
      <div><label>絵文字</label><input id="addEmoji" placeholder="🗓" maxlength="2"></div>
    </div>
    <label>URL</label><input id="addUrl" placeholder="https://あなたのサーバー/cal/" inputmode="url">
    <button class="btn" id="addBtn">追加する</button>
    <p style="color:#8090a0;font-size:11px;margin:8px 0 0">
      kcaldav.php のURLを入れればカレンダー、kuragev.php を入れれば動画、と中身は開くURL次第で変わります。</p>
  </div>

  <p class="hint">タップでアプリ内に開きます。端末の「戻る」でここへ戻ります。<br>powered by Capacitor</p>
</main>

<script>
  // 既定のKurageサービス(URLを差し替えれば中身が変わる、という思想の実例)
  var BUILTIN = [
    {emoji:'🗓', name:'カレンダー',  url:'https://exbridge.jp/cal/'},
    {emoji:'🎬', name:'Kurage動画', url:'https://kurage.exbridge.jp/kuragev.php'}
  ];

  function load(){ try{ return JSON.parse(localStorage.getItem('kc_links')||'[]'); }catch(e){ return []; } }
  function save(a){ localStorage.setItem('kc_links', JSON.stringify(a)); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function tileHtml(item, idx){
    var del = (idx!=null) ? '<button class="del" data-i="'+idx+'">×</button>' : '';
    return '<a class="tile" href="'+esc(item.url)+'">'+del+
      '<span class="emoji">'+esc(item.emoji||'🔗')+'</span>'+
      '<span><b>'+esc(item.name)+'</b><br><small>'+esc(item.url)+'</small></span></a>';
  }

  function render(){
    document.getElementById('builtin').innerHTML = BUILTIN.map(function(x){return tileHtml(x,null);}).join('');
    var mine = load();
    var m = document.getElementById('mine');
    m.innerHTML = mine.length ? mine.map(function(x,i){return tileHtml(x,i);}).join('')
      : '<p style="grid-column:1/3;color:#9aa8b5;font-size:12.5px;text-align:center;padding:8px 0">まだありません。下から追加できます。</p>';
    // 削除
    var dels = m.querySelectorAll('.del');
    for (var k=0;k<dels.length;k++){
      dels[k].addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var a=load(); a.splice(parseInt(this.getAttribute('data-i'),10),1); save(a); render();
      });
    }
  }

  document.getElementById('addBtn').addEventListener('click', function(){
    var name=document.getElementById('addName').value.trim();
    var url=document.getElementById('addUrl').value.trim();
    var emoji=document.getElementById('addEmoji').value.trim()||'🔗';
    if(!name || !/^https?:\/\//.test(url)){ alert('名前と、http(s)で始まるURLを入れてください。'); return; }
    var a=load(); a.push({emoji:emoji,name:name,url:url}); save(a);
    document.getElementById('addName').value=''; document.getElementById('addUrl').value=''; document.getElementById('addEmoji').value='';
    render();
  });
  document.getElementById('editBtn').addEventListener('click', function(){
    document.body.classList.toggle('edit');
    this.textContent = document.body.classList.contains('edit') ? '完了' : '編集';
  });

  // アプリ(Capacitor)では、タイルを"アプリ内ブラウザ"で開く。
  // → 閉じる(×)ボタンで必ずランチャーに戻れる／中身は本物のChromeなので
  //   リール等の自動再生・全画面も動く。ブラウザ(非アプリ)では普通に遷移。
  var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (isNative) {
    document.addEventListener('click', function(e){
      var a = e.target.closest ? e.target.closest('a.tile') : null;
      if (!a) return;
      if (document.body.classList.contains('edit')) return; // 編集中の削除等は通常動作
      e.preventDefault();
      var B = window.Capacitor.Plugins.Browser;
      if (B && B.open) { B.open({ url: a.getAttribute('href'), toolbarColor: '#2f6bd8', presentationStyle: 'fullscreen' }); }
      else { window.location.href = a.getAttribute('href'); }
    }, true);
  }

  render();
</script>
</body>
</html>
